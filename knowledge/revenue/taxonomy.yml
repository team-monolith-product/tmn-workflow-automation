# 매출 분류 규칙
#
# 이 파일 하나만 고치면 분류 기준이 바뀐다. 파이프라인 코드는 건드리지 않는다.
# 뷰(view)를 추가하면 대시보드에 탭이 하나 더 생기고 facts.json에 필드가 하나 더 붙는다.
#
# 적용 순서: exceptions를 위에서부터 훑어 처음 걸리는 규칙을 쓰고, 하나도 안 걸리면 base를 쓴다.
# base에도 없는 원분류가 나오면 '미분류'로 떨어뜨리고 빌드가 경고를 낸다. 조용히 삼키지 않는다.

version: "2026-09-10"
default_view: "상품8분류"

views:

  # ── 1. 매출장에 적힌 분류를 그대로 쓴다. 가공이 없어 원장 대사가 바로 된다.
  원분류:
    label: "매출장 원분류"
    note: >-
      매출장 I열 값 그대로. 2026은 대분류 8종이라 「상품 분류」와 같고, 2025 이하는 옛 16종이며
      제품축·고객축·채널축이 섞여 있다. 연도별로 뜻이 다르니 여러 해를 이 축으로 묶지 않는다.
    kind: passthrough
    field: category_raw

  # ── 2. 어느 상품을 팔았는가.
  #
  # 🔴 2026-09-10 개편. 매출장에 「분류마스터」 탭이 생기고 26년(신) 탭이 대분류 8종을 직접 적기
  #    시작했다. 그래서 2026부터는 규칙이 아니라 **매출장에 적힌 대분류를 그대로 쓴다**(prefer_raw).
  #    2025년 이하는 옛 16종뿐이라 규칙으로 같은 8종에 맞춘다. 그래야 연도 비교가 된다.
  #    버킷 이름도 매출장 표기에 맞췄다. 한 회사에 매출 분류 어휘가 둘이면 안 된다.
  상품8분류:
    label: "상품 분류"
    note: >-
      판매 상품 축. 항목·순서·세부분류의 정본은 매출장 「분류마스터」 탭이며 빌드가 그것을 그대로 읽는다.
      2026은 매출장에 적힌 대분류를 쓰고, 2025 이하는 옛 16종을 같은 체계로 환산했다.
    kind: rules
    # 대분류를 펼치면 세부분류 소계가 먼저 나온다. 2025 이하는 세부분류가 없어 바로 거래 목록이 나온다.
    child: "세부분류"
    # 매출장이 스스로 분류한 행은 규칙을 건너뛴다
    prefer_raw:
      - "1. 코들 라이선스"
      - "2. 해커톤(짓다)"
      - "3. 콘텐츠"
      - "4. 플랫폼 제공 개발"
      - "5. 연수용역"
      - "6. 교육용역"
      - "7. 글로벌"
      - "8. 기타"
      - "9. AI 캠프(코들)"
    order:
      - "1. 코들 라이선스"
      - "2. 해커톤(짓다)"
      - "3. 콘텐츠"
      - "4. 플랫폼 제공 개발"
      - "5. 연수용역"
      - "6. 교육용역"
      - "7. 글로벌"
      - "8. 기타"
      - "9. AI 캠프(코들)"
    base:
      초등: "1. 코들 라이선스"
      중등: "1. 코들 라이선스"
      고등: "1. 코들 라이선스"
      대학: "1. 코들 라이선스"
      지자체: "1. 코들 라이선스"
      기관: "1. 코들 라이선스"
      교육납품: "1. 코들 라이선스"
      교육제공: "1. 코들 라이선스"
      연수제공: "1. 코들 라이선스"
      연수납품: "1. 코들 라이선스"
      짓다: "2. 해커톤(짓다)"
      콘텐츠: "3. 콘텐츠"
      연구개발: "4. 플랫폼 제공 개발"
      연수용역: "5. 연수용역"
      교육용역: "6. 교육용역"
      기타: "8. 기타"
    exceptions:
      # --- AIDT 계열은 원분류가 무엇이든 플랫폼으로 간다 ---
      - id: "aidt-금성"
        when: {counterparty_has: "금성", item_has: "AIDT"}
        then: "4. 플랫폼 제공 개발"
        why: "AI 디지털교과서 구독료 수익쉐어 수취분. 대표 확인 2026-08-08"
      - id: "aidt-금성-플랫폼구축"
        when: {counterparty_has: "금성", item_has: "플랫폼 구축료"}
        then: "4. 플랫폼 제공 개발"
        why: "품목명은 구축료이나 성격은 AIDT 수익쉐어. 대표 확인 2026-08-20"
      - id: "aidt-keris-클라우드"
        when: {counterparty_has: "한국교육학술정보원", item_has: "AIDT"}
        then: "4. 플랫폼 제공 개발"
        why: "AIDT 활용연수 클라우드 비용. 2025·2026 동일 건"
      - id: "aidt-잇플-서버"
        when: {counterparty_has: "잇플", item_has: "AIDT"}
        then: "4. 플랫폼 제공 개발"
        why: "내곡초 AIDT 서버 이용료. 대표 확인 2026-08-16"
      - id: "aidt-씨마스-뷰어"
        when: {counterparty_has: "씨마스", item_has: "뷰어"}
        then: "4. 플랫폼 제공 개발"
        why: "출판사 플랫폼 개발. 대표 확인 2026-08-16"

      # --- 콘텐츠 ---
      - id: "콘텐츠-씨마스-저작"
        when: {counterparty_has: "씨마스", item_has: "저작"}
        then: "3. 콘텐츠"
        why: "콘텐츠 저작비. 뷰어 개발비와 분리. 대표 확인 2026-08-16"
      - id: "콘텐츠-라이브트위커"
        when: {item_has: "라이브트위커"}
        then: "3. 콘텐츠"
        why: "라이브트위커 사용료는 콘텐츠. 대표 확인 2026-08-16"
      - id: "콘텐츠-제이에듀"
        when: {counterparty_has: "제이에듀"}
        then: "3. 콘텐츠"
        why: "SW 콘텐츠 및 프로그램 개발대행"
      - id: "콘텐츠-모두의ai챌린지"
        when: {item_has: "모두의 AI 챌린지"}
        then: "3. 콘텐츠"
        why: "선금·잔금 모두 콘텐츠. 대표 확인 2026-08-16"

      # --- 짓다 ---
      - id: "짓다-해커톤-2025전북"
        when: {year: 2025, counterparty_has: "전북특별자치도교육청", item_has: "해커톤"}
        then: "2. 해커톤(짓다)"
        why: "짓다 분류 신설 전 건이나 실질은 해커톤 운영. 2025 유일 건"
      - id: "짓다-활용비"
        when: {item_has: "짓다"}
        then: "2. 해커톤(짓다)"
        why: "사업비 안에서 팔린 짓다 자체흡수 분리분"

      # --- 연수·교육용역 귀속 정정 ---
      - id: "반납금-디지털새싹"
        when: {item_has: "디지털새싹", item_has_any: ["반납"]}
        then: "6. 교육용역"
        why: "디지털새싹은 교육용역 계열. 매출장 원분류가 연수용역인 반납금 1건 정정. 대표 확인 2026-08-16"
      - id: "한양대-경기미래형-선발행"
        when: {year: 2025, counterparty_has: "한양대", item_has: "경기미래형"}
        then: "5. 연수용역"
        why: "발행 시점 판매 실질이 연수용역이고 계산서 품목과 일치. 짓다로 소급하지 않는다. 대표 확인 2026-08-16"

      # --- 매출이 아닌 것 ---
      - id: "기타-자산처분"
        when: {item_has: "아이폰"}
        then: "8. 기타"
        why: "자산 처분인데 세금계산서가 나가 매출장에 남았다"

  # ── 2-1. 매출장 J열 세부분류. 2026(신) 탭에만 있다.
  세부분류:
    label: "세부분류"
    note: "매출장 「분류마스터」의 2단계 분류. 2026년 발행분에만 있고 그 이전은 미기재다."
    kind: passthrough
    field: subcategory_raw
    empty: "미기재 (2026 이전)"

  # ── 3. 누구에게 팔았는가. 거래처 성격 축.
  고객군:
    label: "고객군"
    note: >-
      돈을 낸 쪽의 성격. 2026은 매출장 세부분류가 구매 주체를 직접 적으므로 그것을 먼저 쓰고,
      2025 이하는 원분류와 거래처명으로 판정한다. 컨소시엄 사업은 산학협력단이 창구여도
      사업으로 본다 — 실제 발주는 국가기관이기 때문이다.
    kind: rules
    order:
      - "학교(초·중·고)"
      - "대학"
      - "교육청·지자체"
      - "공공기관·재단"
      - "기업·채널"
      - "사업(컨소시엄)"
      - "미상"
    base:
      초등: "학교(초·중·고)"
      중등: "학교(초·중·고)"
      고등: "학교(초·중·고)"
      대학: "대학"
      지자체: "교육청·지자체"
      기관: "공공기관·재단"
      교육납품: "기업·채널"
      연수납품: "기업·채널"
      교육제공: "사업(컨소시엄)"
      연수제공: "사업(컨소시엄)"
      교육용역: "사업(컨소시엄)"
      연수용역: "사업(컨소시엄)"
      연구개발: "공공기관·재단"
      콘텐츠: "공공기관·재단"
      짓다: "학교(초·중·고)"
      기타: "미상"
    exceptions:
      # 2026부터 매출장이 세부분류로 구매 주체를 직접 적는다. 추정보다 이것이 앞선다.
      - id: "세부-학교"
        when: {sub_any: ["학교 판매(초·중·고)", "학교"]}
        then: "학교(초·중·고)"
      - id: "세부-대학"
        when: {sub_any: ["대학", "대학 플랫폼 구축·개발"]}
        then: "대학"
      - id: "세부-교육청"
        when: {sub_any: ["교육청·지자체 단위", "교육청", "교육청 플랫폼 구축·개발"]}
        then: "교육청·지자체"
      - id: "세부-사업"
        when: {sub_any: ["주관", "컨소", "사업비 자체 흡수"]}
        then: "사업(컨소시엄)"
        why: "발주는 국가기관이고 산학협력단·컨소시엄사는 자금 창구다"
      - id: "세부-기업채널"
        when: {sub_any: ["채널·위탁 납품", "콘텐츠 개발대행(출판사)", "출판사 플랫폼 SI",
                         "AIDT 수익쉐어", "라이브트위커 사용료", "성인 대상", "UAE·해외"]}
        then: "기업·채널"
      - id: "세부-공공"
        when: {sub_any: ["기타 기관", "AIDT 개발·프로토타입", "콘텐츠 사업"]}
        then: "공공기관·재단"
      - id: "세부-미상"
        when: {sub_any: ["유지보수", "기타", "자산처분등"]}
        then: "미상"

      # 2025 이하 — 세부분류가 없으므로 거래처명으로 판정한다
      - id: "고객-교육청"
        when: {counterparty_regex: "교육청|교육연구정보원|교육과정평가정보원|교육원|지원단"}
        then: "교육청·지자체"
        why: "거래처명에 교육청 계열이 들어가면 원분류와 무관하게 교육청으로 본다"
      - id: "고객-대학"
        when: {counterparty_regex: "대학교|대학|산학협력단|산단|교육대학"}
        then: "대학"
        why: "산학협력단 경유 건"
      - id: "고객-학교"
        when: {counterparty_regex: "(초등학교|중학교|고등학교|여자중|여자고|국제중)$"}
        then: "학교(초·중·고)"
      - id: "고객-법인"
        when: {counterparty_regex: "주식회사|\\(주\\)|㈜|유한회사|출판사|교육\\(주\\)"}
        then: "기업·채널"
      - id: "고객-재단"
        when: {counterparty_regex: "재단|학술정보원|창의재단|진흥원|협회|커넥트"}
        then: "공공기관·재단"

  # ── 4~6. 보강 테이블에서 오는 축. config/enrichment.yml의 값을 그대로 버킷으로 쓴다.
  #        값이 없으면 '미상'으로 떨어진다. 매출장에는 없는 정보라 미상이 나오는 것이 정상이다.
  학교급:
    label: "학교급"
    note: "노션 CRM 학교 마스터 기준. 마스터에 없는 학교는 학교명 접미사에서 도출했다."
    kind: enrichment
    field: school_level
    empty: "학교 아님·미상"
    order: ["초등학교", "중학교", "고등학교", "특수학교", "각종학교", "학교 아님·미상"]

  교육청:
    label: "교육청·지역"
    note: "노션 CRM 학교 마스터 기준. CRM 미러가 10,000행에서 잘려 있어 일부 학교는 미상이다."
    kind: enrichment
    field: edu_office
    empty: "미상"

  예산출처:
    label: "예산출처"
    note: "CRM 딜의 예산출처. 학교 자체 예산인지 정책 예산인지 가른다. 딜에 기재된 건만 잡힌다."
    kind: enrichment
    field: budget_source
    empty: "미기재"

# 빌드 검증. 여기 적힌 값과 어긋나면 빌드가 경고를 찍는다. 조용히 지나가지 않는다.
# 출처: 00_SSOT/02_지표.md, 01_공용/deliverables/매출분해_마스터.md
assertions:
  year_totals_issued:
    2023: 346832002
    2024: 2746305912
    2025: 5610314600
  tolerance_won: 5
