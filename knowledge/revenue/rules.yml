product:
  base:
    초등: 1. 코들 라이선스
    중등: 1. 코들 라이선스
    고등: 1. 코들 라이선스
    대학: 1. 코들 라이선스
    지자체: 1. 코들 라이선스
    기관: 1. 코들 라이선스
    교육납품: 1. 코들 라이선스
    교육제공: 1. 코들 라이선스
    연수제공: 1. 코들 라이선스
    연수납품: 1. 코들 라이선스
    짓다: 2. 해커톤(짓다)
    콘텐츠: 3. 콘텐츠
    연구개발: 4. 플랫폼 제공 개발
    연수용역: 5. 연수용역
    교육용역: 6. 교육용역
    기타: 8. 기타
  exceptions:
  - when:
      customer_has: 금성
      item_has: AIDT
    then: 4. 플랫폼 제공 개발
  - when:
      customer_has: 금성
      item_has: 플랫폼 구축료
    then: 4. 플랫폼 제공 개발
  - when:
      customer_has: 한국교육학술정보원
      item_has: AIDT
    then: 4. 플랫폼 제공 개발
  - when:
      customer_has: 잇플
      item_has: AIDT
    then: 4. 플랫폼 제공 개발
  - when:
      customer_has: 씨마스
      item_has: 뷰어
    then: 4. 플랫폼 제공 개발
  - when:
      customer_has: 씨마스
      item_has: 저작
    then: 3. 콘텐츠
  - when:
      item_has: 라이브트위커
    then: 3. 콘텐츠
  - when:
      customer_has: 제이에듀
    then: 3. 콘텐츠
  - when:
      item_has: 모두의 AI 챌린지
    then: 3. 콘텐츠
  - when:
      year: 2025
      customer_has: 전북특별자치도교육청
      item_has: 해커톤
    then: 2. 해커톤(짓다)
  - when:
      item_has: 짓다
    then: 2. 해커톤(짓다)
  - when:
      item_has: 디지털새싹
      item_has_any:
      - 반납
    then: 6. 교육용역
  - when:
      year: 2025
      customer_has: 한양대
      item_has: 경기미래형
    then: 5. 연수용역
  - when:
      item_has: 아이폰
    then: 8. 기타
