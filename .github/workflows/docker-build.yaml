name: Docker Build

on:
  pull_request:
    paths:
      - Dockerfile
      - requirements.txt
      - .dockerignore
      - .github/workflows/docker-build.yaml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build production image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
